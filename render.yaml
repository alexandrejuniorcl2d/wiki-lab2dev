# Blueprint do Render: Wiki.js (plano free) conectado ao Supabase.
# Criado em Render > New > Blueprint, apontando para este repositório.
# As variáveis com "sync: false" são pedidas pelo Render na criação e nunca ficam no Git.
services:
  - type: web
    name: wiki-lab2dev
    runtime: docker
    plan: free
    # Mesma região do projeto Supabase (East US / North Virginia): app e banco próximos
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Só rebuilda quando a imagem muda (conteúdo e scripts não afetam o container)
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - branding/**
    envVars:
      # O Wiki.js escuta na 3000; o PORT avisa o Render (o padrão dele é 10000)
      - key: PORT
        value: "3000"
      - key: DB_TYPE
        value: postgres
      # Session pooler do Supabase (IPv4). Ex.: aws-0-us-east-1.pooler.supabase.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      # Ex.: postgres.abcdefghijklmnop (usuário do session pooler)
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: postgres
      # TLS verificado com a CA pública do Supabase (supabase/prod-ca-2021.crt, sem cabeçalho e sem quebras de linha)
      - key: DB_SSL_CA
        value: ""
